  const newest = parsed[parsed.length - 1], prevRows = QIC.months[newest.key] || (Q_LATEST && QIC.months[Q_LATEST]);
  if (prevRows) {
    const before = new Set(prevRows.rows.map((r) => r[2])), after = new Set(newest.rows.map((r) => r[2]));
    const added = [...after].filter((x) => !before.has(x)), gone = [...before].filter((x) => !after.has(x));
    if (added.length) warnings.push(`New PSO code(s) compared with the last upload: ${added.slice(0, 10).join(", ")}${added.length > 10 ? "…" : ""}`);
    if (gone.length) warnings.push(`PSO code(s) in the last upload but not in this file: ${gone.slice(0, 10).join(", ")}${gone.length > 10 ? "…" : ""}`);
  }
  const replacing = parsed.filter((x) => QIC.months[x.key]).map((x) => monthLabel(x.key));
  if (replacing.length) warnings.push(`This replaces the Quality Quest data already in the portal for: ${replacing.join(", ")}.`);
  const html = `<div class="msg ok"><b>Ready: ${parsed.length} month${parsed.length > 1 ? "s" : ""} (${parsed.map((x) => monthLabel(x.key)).join(", ")})</b>
    ${notes.filter((n) => n.includes(":")).length ? `<p class="muted">${esc(notes.filter((n) => n.includes(":")).join(" · "))}.</p>` : ""}
    ${notes.filter((n) => !n.includes(":")).length ? `<p class="muted">Empty sheets skipped: ${esc(notes.filter((n) => !n.includes(":")).join(", "))}.</p>` : ""}
    <div class="tablebox"><table><thead><tr><th>Sheet</th><th>Month</th><th class="num">PSOs</th><th class="num">Avg score</th><th class="num">Team ach</th><th class="num">≥100% sales</th><th>Top PSO</th></tr></thead><tbody>
    ${parsed.map((x) => { const S = x.scored.reduce((a, r) => a + r.sales, 0), B = x.scored.reduce((a, r) => a + r.budget, 0), top = x.scored.find((r) => r.rank === 1), nb = critFor(x.key).ach.length;
      return `<tr><td>${esc(x.name)}</td><td>${monthLabel(x.key)}</td><td class="num">${x.rows.length}</td><td class="num">${r2(x.scored.reduce((a, r) => a + r.total, 0) / x.scored.length)}</td><td class="num">${B ? (Math.round((S / B) * 1000) / 10) + "%" : "–"}</td><td class="num">${x.scored.filter((r) => r.band === nb - 1).length}</td><td>${top ? esc(top.n) + " (" + fScore(top.total) + ")" : ""}</td></tr>`; }).join("")}
    </tbody></table></div><p class="muted">Compare these with your Excel before publishing.</p></div>`;
  return { errors, warnings, html,
    apply: (next) => { next.qic = next.qic || { criteria: [], months: {} }; parsed.forEach((x) => { next.qic.months[x.key] = { rows: x.rows }; }); },
    hist: { m: parsed[0].key, m2: parsed.length > 1 ? newest.key : null, final: true, upTo: null, n: newest.rows.length },
    flash: `${parsed.length > 1 ? monthLabel(parsed[0].key) + " – " + monthLabel(newest.key) : monthLabel(newest.key)} published for Quality Quest.` };
}

// ---------- Quality Quest: scoring criteria (effective from a chosen month) ----------
function critCheck(X, buf, ctx) {
  const errors = [], warnings = [];
  const wb = X.read(buf, { type: "array" });
  const name = wb.SheetNames.find((n) => norm(n) === "CRITERIA") || wb.SheetNames.find((n) => { const r = X.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: null }); return r.some((row) => row && row.some((c) => norm(c).startsWith("SCORINGCRITERIA"))); });
  if (!name) return { errors: ['No "Criteria" sheet found in this file.'], warnings };
  const g = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });
  const at = (test) => { for (let r = 0; r < g.length; r++) for (let c = 0; c < (g[r] || []).length; c++) if (test(norm(g[r][c]))) return [r, c]; return null; };
  const col = (r0, c, n) => { const out = []; for (let r = r0 + 1; r < g.length; r++) { const row = g[r] || []; if (row[c] == null || row[c] === "") break; out.push(Array.from({ length: n }, (_, j) => row[c + j])); } return out; };
  const hAch = at((h) => h.startsWith("ACH(%)FROM")), hT = at((h) => h === "#BRANDS"), hRx = at((h) => h.startsWith("RX(%)FROM")), hItem = at((h) => h === "ITEM");
  if (!hAch || !hT || !hRx || !hItem) return { errors: ["Couldn't find all four criteria tables (Ach(%) from · # Brands · Rx(%) from · Item). Keep the same layout as the original Criteria sheet."], warnings };
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const ach = col(hAch[0], hAch[1], 2), t12raw = col(hT[0], hT[1], 3), rx = col(hRx[0], hRx[1], 3), items = col(hItem[0], hItem[1], 3);
  if (!ach.length || ach.some((r) => !isNum(r[0]) || !isNum(r[1]))) errors.push("Sales Achievement table: every row needs a number in 'Ach(%) from' and 'Score'.");
  if (ach.some((r, i) => i && r[0] <= ach[i - 1][0])) errors.push("Sales Achievement table: 'Ach(%) from' values must go up row by row.");
  if (ach.length && ach[0][0] !== 0) errors.push("Sales Achievement table: the first row must start from 0.");
  const t12 = []; for (let n = 0; n <= 12; n++) { const r = t12raw.find((x) => x[0] === n); if (!r || !isNum(r[1]) || !/^[A-E]$/.test(String(r[2]).trim())) { errors.push(`Top-12 table: row for ${n} brand(s) is missing or incomplete (needs a score and a category A–E).`); break; } t12.push([r[1], String(r[2]).trim()]); }
  if (!rx.length || rx.some((r) => !isNum(r[0]) || !isNum(r[1]) || !/^[A-E]$/.test(String(r[2]).trim()))) errors.push("Rx Share table: every row needs 'Rx(%) from', 'Score' and a category A–E.");
  if (rx.some((r, i) => i && r[0] <= rx[i - 1][0])) errors.push("Rx Share table: 'Rx(%) from' values must go up row by row.");
  if (rx.length && rx[0][0] !== 0) errors.push("Rx Share table: the first row must start from 0.");
  const it = (k) => items.find((r) => norm(r[0]).startsWith(k));
  const dr = it("DR"), ch = it("CHEM");
  if (!dr || !isNum(dr[1]) || !isNum(dr[2])) errors.push("Coverage table: the Dr. Coverage row needs a target (e.g. 0.25) and a score.");
  if (!ch || !isNum(ch[1]) || !isNum(ch[2])) errors.push("Coverage table: the Chemist Coverage row needs a target (e.g. 0.6) and a score.");
  if (dr && isNum(dr[1]) && dr[1] > 1) errors.push("Dr. Coverage target must be a fraction (0.25 means 25%).");
  if (ch && isNum(ch[1]) && ch[1] > 1) errors.push("Chemist Coverage target must be a fraction (0.6 means 60%).");
  if (errors.length) return { errors, warnings };
  const crit = { from: ctx.month, ach: ach.map((r) => [r[0], r[1]]), t12, rx: rx.map((r) => [r[0], r[1], String(r[2]).trim()]), dr: [dr[1], dr[2]], chem: [ch[1], ch[2]] };
  const cur = critFor(ctx.month);
  const same = cur && JSON.stringify({ ...cur, from: 0 }) === JSON.stringify({ ...crit, from: 0 });
  if (same) warnings.push(`These rules are the same as the criteria already in effect for ${monthLabel(ctx.month)}.`);
  const earlier = qMonthKeys().filter((m) => m < ctx.month);
  if (earlier.length) warnings.push(`Months before ${monthLabel(ctx.month)} (${earlier.map((m) => monthLabel(m).slice(0, 3)).join(", ")}) keep the rules they were scored under.`);
  if (QIC.criteria.some((c) => c.from === ctx.month)) warnings.push(`This replaces the criteria already set to start from ${monthLabel(ctx.month)}.`);
  // Impact on months from the effective month onward
  const list = [...QIC.criteria.filter((c) => c.from !== ctx.month), crit];
  const affected = qMonthKeys().filter((m) => m >= ctx.month && critFor(m, list) === crit).map((m) => {
    const before = qScored(m), after = scoreRows(QIC.months[m].rows, crit); const bm = new Map(before.map((x) => [x.p, x]));
    return { m, score: after.filter((x) => Math.abs(x.total - bm.get(x.p).total) > 0.001).length, rank: after.filter((x) => x.rank !== bm.get(x.p).rank).length, n: after.length };
  });
  const row = (label, a, b) => `<tr><td>${label}</td><td>${esc(a)}</td><td class="${a !== b ? "chg" : ""}">${esc(b)}</td></tr>`;
  const fmtT = (c) => `0–5 → ${c.t12[5][0]}, 6 → ${c.t12[6][0]}, 12 → ${c.t12[12][0]}`;
  const html = `<div class="msg ok"><b>Ready: criteria effective from ${monthLabel(ctx.month)}</b>
    <div class="tablebox"><table><thead><tr><th>Rule</th><th>Now (from ${cur ? monthLabel(cur.from) : "–"})</th><th>New</th></tr></thead><tbody>
    ${row("Sales Ach (from % → score)", cur ? cur.ach.map((r) => `${r[0]}→${r[1]}`).join(", ") : "–", crit.ach.map((r) => `${r[0]}→${r[1]}`).join(", "))}
    ${row("Top 12 brands", cur ? fmtT(cur) : "–", fmtT(crit))}
    ${row("Rx share (from % → score)", cur ? cur.rx.map((r) => `${r[0]}→${r[1]}`).join(", ") : "–", crit.rx.map((r) => `${r[0]}→${r[1]}`).join(", "))}
    ${row("Dr. coverage", cur ? `≥${Math.round(cur.dr[0] * 100)}% → ${cur.dr[1]}` : "–", `≥${Math.round(crit.dr[0] * 100)}% → ${crit.dr[1]}`)}
    ${row("Chemist coverage", cur ? `≥${Math.round(cur.chem[0] * 100)}% → ${cur.chem[1]}` : "–", `≥${Math.round(crit.chem[0] * 100)}% → ${crit.chem[1]}`)}
    </tbody></table></div>

// Inside claude.ai a page can't download files directly; route the mini app's blob download
// (an <a download> click) through the viewer's "downloads" prompt instead.
(function () {
  const orig = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    const href = this.href || "", name = this.download || "";
    const c = window.claude;
    if (!name || !href.startsWith("blob:") || !c || !c.use) return orig.call(this);
    const blobP = fetch(href).then(r => r.blob());   // read now: the add-on revokes the URL after 1 s
    (async () => {
      let dl = null; try { dl = await c.use("downloads"); } catch (e) {}
      if (!dl) return orig.call(this);
      try { await dl.save({ filename: name, data: await blobP }); }
      catch (e) { if (e && e.code && e.code !== "declined") alert("Could not save the file: " + (e.message || e.code)); }
    })();
  };
})();
