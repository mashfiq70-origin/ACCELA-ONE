  const now = () => root.getAttribute("data-theme") || (mq && mq.matches ? "dark" : "light");
  function paint() {

.gate-logo{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,9vw,46px);letter-spacing:.03em;line-height:1;margin:0}
.gate-logo span{color:var(--accent)}
.gate-tag{margin:6px 0 0;color:var(--muted);font-size:15px}
.gate form{display:flex;flex-direction:column;gap:12px}
.gate input[type=password],.gate input[type=text]{font:inherit;font-size:17px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.gate input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.gate .pw-wrap{position:relative}
.gate .pw-wrap input{padding-right:64px}
.gate .peek{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:13px;font-weight:600;color:var(--accent-ink);background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.gate .remember{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.gate .remember input{accent-color:var(--accent);width:17px;height:17px}
.gate .go{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:13px 18px;background:var(--accent);color:#fff;cursor:pointer}
.gate .go:disabled{opacity:.7;cursor:wait}
.gate .go:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.gate-err{background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:10px 12px;font-size:14px;font-weight:600}
.gate-credit{border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted);line-height:1.5}
.gate-credit b{color:var(--accent-ink)}
/* Contact box + Connect us */
.ct-link{font:inherit;font-weight:700;color:var(--accent-ink);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ct-modal{position:fixed;inset:0;z-index:350;background:rgba(8,16,10,.55);display:grid;place-items:center;padding:20px 16px;overflow-y:auto}
.ct-sheet{width:min(440px,100%);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:16px;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.ct-sheet.ct-wide{width:min(620px,100%)}
.ct-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ct-head h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:800}
.ct-x{font:inherit;font-size:24px;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px}
.ct-x:hover{background:var(--bg)}
.ct-lead{margin:0;color:var(--muted);font-size:14.5px}
.ct-card{display:flex;flex-direction:column;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.5}
.ct-card b{font-size:16px;font-family:var(--f-display)}
.ct-card span{color:var(--muted)}
.ct-card a{color:var(--accent-ink);font-weight:600;text-decoration:none;margin-top:2px}
.ct-card a:hover{text-decoration:underline}
#ct-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.ct-f{display:flex;flex-direction:column;gap:5px;min-width:0}
.ct-f.ct-full,.ct-err,.ct-act{grid-column:1 / -1}
.ct-f label{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.ct-f label i,.ct-note i{font-style:normal;color:var(--bad)}
.ct-f input,.ct-f select,.ct-f textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.ct-f textarea{resize:vertical;min-height:110px}
.ct-f input:focus-visible,.ct-f select:focus-visible,.ct-f textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.ct-f.bad input,.ct-f.bad select,.ct-f.bad textarea{border-color:var(--bad)}
.ct-err{background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:10px 12px;font-size:14px;font-weight:600}
.ct-err.ok{background:var(--accent-soft);color:var(--accent-ink)}
.ct-act{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ct-note{font-size:12.5px;color:var(--muted)}
.ct-send{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:11px 28px;background:var(--accent);color:#fff;cursor:pointer}
.ct-send:disabled{opacity:.6;cursor:default}
.ct-direct{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.a1-connect{display:none;position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;align-items:center;gap:9px;font:inherit;font-weight:700;font-size:15px;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:12px 18px 12px 15px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.a1-connect svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.a1-connect:hover{filter:brightness(1.07)}
.a1-connect:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
body.on-home .a1-connect{display:inline-flex}
@media (max-width:560px){#ct-form{grid-template-columns:1fr}.ct-sheet{padding:18px 18px 20px}.a1-connect{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}}

.pw-card{margin-top:4px}
.pw-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pw-row .field{flex:1 1 200px;min-width:0}
.pw-row input{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
#pw-msg:empty,#apw-msg:empty,#apw-gmsg:empty{display:none}
.apw-gate{max-width:440px;display:flex;flex-direction:column;gap:12px;padding:8px 0}
.apw-gate>b{font-family:var(--f-display);font-size:20px}
.apw-gate form{display:flex;flex-direction:column;gap:12px}
.apw-gate input{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.apw-act{display:flex;gap:10px;flex-wrap:wrap}

<script data-a1="">
// ACCELA ONE lock: the data block is AES-256-GCM encrypted with a key derived from the

(function () {
  const KEY = "a1-pass";

bsel.addEventListener("change", () => { state.brand = bsel.value; renderReport(); });
// Month list for one report: Jan 2026 up to that report's newest month
function fillMonths(src, latest, runFn) {
  const opts = [];
  for (let [y, m] = FIRST_MONTH.split("-").map(Number); `${y}-${String(m).padStart(2, "0")}` <= (latest || LATEST); m === 12 ? (y++, m = 1) : m++) opts.push(`${y}-${String(m).padStart(2, "0")}`);
  msel.innerHTML = opts.reverse().map((k) => `<option value="${k}">${monthLabel(k)}${runFn(k) ? " (running)" : src[k] ? (src[k].cats ? ` (month end · ${catOnlyText(src[k])} only)` : " (month end)") : " (no data yet)"}</option>`).join("");
}

// ================= REPORT: FIELD FORCE SALES STATUS =================
const kpis = (list) => `<div class="summary">${list.map(([k, v, note]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>${note ? `<div class="kd">${note}</div>` : ""}</div>`).join("")}</div>`;
// Change in sales value vs the previous month: ▲ green for growth, ▼ red for decline.
const prevMonthKey = (k) => { const [y, m] = k.split("-").map(Number); const d = new Date(y, m - 2, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const deltaHtml = (cur, prev, short) => {
  if (prev == null) return `<span class="muted">–</span>`;
  const d = cur - prev, p = prev !== 0 ? (d / Math.abs(prev)) * 100 : NaN, up = d >= 0;
  return `<span class="${up ? "up" : "down"}">${up ? "▲" : "▼"} ${tk(Math.abs(d))}</span>${short ? "" : `<small class="dp">${isFinite(p) ? (up ? "+" : "−") + Math.abs(p).toFixed(1) + "%" : ""}</small>`}`;
};
const scale = 150; // bar: 150% = full width, target line at 100%
const bar = (a) => `<div class="bar"><i class="${tone(a)}" style="width:${isFinite(a) ? Math.max(0, Math.min(a / scale * 100, 100)) : 0}%"></i><span class="tgt" style="left:${100 / scale * 100}%"></span></div>`;

function boardTable(rows, total, cmp, dx) {
  const dc = (p, sv, bv) => (dx ? dsiCells(dsiCalc(sv, bv, dx.s7(p), dx.ctx)) : "");

    <tbody>${rows.map((r) => `<tr>
      <td><span class="rk ${r.rank <= 3 ? "top" : ""}">${r.rank}</span></td>
      <td class="dsmc">${esc(r.p.d)}<small>${esc(DATA.dsms[r.p.d] || "")}</small></td>
      <td class="code">${esc(r.p.p)}</td>

      <td class="num">${tk(r.s)}</td><td class="num">${tk(r.b)}</td>

      ${dx ? "" : `<td class="barcell">${bar(r.a)}</td>`}${cmp ? `<td class="num delta">${deltaHtml(r.s, cmp.prev.get(r.p.p))}</td>` : ""}${dc(r.p, r.s, r.b)}</tr>`).join("")}</tbody>
    ${total ? `<tfoot><tr><td></td><td class="dsmc">${esc(total.d)}</td><td></td><td>Team total · ${total.n} PSOs</td>
      <td class="num">${tk(total.s)}</td><td class="num">${tk(total.b)}</td>
      <td class="num"><span class="pill ${tone(total.a)}">${pct(total.a)}</span></td>${dx ? "" : `<td class="barcell">${bar(total.a)}</td>`}${cmp ? `<td class="num delta">${deltaHtml(total.s, cmp.prevTotal)}</td>` : ""}${dx ? dsiCells(dsiCalc(total.s, total.b, dx.s7tot, dx.ctx)) : ""}</tr></tfoot>` : ""}
    </table></div>`;
}

// DSI inputs for a Field Force month (running only): 7th-day sales per PSO for the chosen category
function ffDsi(m, mk, cat, psos) {
  const ctx = isRunning(mk) ? dsiCtx(m, mk) : null; if (!ctx) return null;
  const d7 = m.d7 && catAvail(m.d7, cat) ? new Map(m.d7.psos.map((q) => [q.p, cat.get(q)[0]])) : null;
  const s7 = (p) => (d7 && d7.has(p.p) ? d7.get(p.p) : null);
  const s7tot = d7 ? psos.reduce((a, p) => a + (d7.get(p.p) || 0), 0) : null;
  return { ctx, s7, s7tot };
}
// "PSOs at 100%+" box: running month (DSI available) → count by predicted month-end achievement
function hitKpi(ranked, dx, hit) {
  const n = ranked.length;
  if (!dx || !dx.ctx || !dx.ctx.has7) return ["PSOs at 100%+", `${hit}<small> of ${n}</small>`];
  const ph = ranked.filter((r) => { const x = dsiCalc(r.s, r.b, dx.s7(r.p), dx.ctx); return x.pred != null && x.pred >= 100; }).length;
  return ["PSOs at 100%+ <small class=\"kpi-tag\">predicted</small>", `${ph}<small> of ${n}</small>`, `Today: ${hit} at 100%+`];
}
function buildLeaderboard(mk) {
  const m = dataFor(mk);
  if (!m) return `<div class="nodata"><b>No data for ${monthLabel(mk)} yet</b>This month will appear once its month-end raw file is uploaded.</div>`;
  const cat = CATS.find((c) => c.id === state.cat) || CATS[0];
  if (!catAvail(m, cat)) return catSeg(m, cat) + catNoData(m, mk, cat);
  const ranked = rankNational(m.psos, cat);
  const n = ranked.length;
  const S = ranked.reduce((a, r) => a + r.s, 0), B = ranked.reduce((a, r) => a + r.b, 0), A = S / B * 100;
  const hit = ranked.filter((r) => r.a >= 100).length;
  const top = ranked.slice(0, 10), bottom = ranked.slice(-10).reverse();
  const dx = ffDsi(m, mk, cat, m.psos);
  return `
    ${catSeg(m, cat)}
    <div class="formula">Achievement = <code>${esc(cat.rule)}</code> · ranked across all ${n} PSOs of Accela</div>
    ${kpis([["Accela achievement", pct(A)], ["Accela sales (Tk)", tk(S)], ["Accela budget (Tk)", tk(B)], hitKpi(ranked, dx, hit)])}
    ${dx ? dsiStrip(dsiCalc(S, B, dx.s7tot, dx.ctx), dx.ctx, `Accela · ${cat.title}`) : ""}
    <div class="boards">
      <div>
        <div class="board-h"><h3><span class="dot" style="--c:var(--good)"></span>Top 10 PSO</h3><span>Highest ${cat.title} achievement</span></div>
        ${boardTable(top, null, null, dx)}
      </div>
      <div>
        <div class="board-h"><h3><span class="dot" style="--c:var(--bad)"></span>Bottom 10 PSO</h3><span>Lowest ${cat.title} achievement, lowest first</span></div>
        ${boardTable(bottom, null, null, dx)}
      </div>
    </div>
    <div class="legend"><span style="--c:var(--good)">100%+</span><span style="--c:var(--warn)">90–99%</span><span style="--c:var(--bad)">Below 90%</span><span style="--c:var(--fg)">Budget line (100%)</span></div>`;
}

// Part 2: one DSM's PSOs, ranked by achievement within the team.
function buildTeam(mk) {
  const m = dataFor(mk);
  if (!m) return `<div class="nodata"><b>No data for ${monthLabel(mk)} yet</b>This month will appear once its month-end raw file is uploaded.</div>`;
  const c = state.dsm;
  const cat = CATS.find((x) => x.id === state.cat) || CATS[0];
  if (!catAvail(m, cat)) return catSeg(m, cat) + catNoData(m, mk, cat);
  const team = rankNational(m.psos.filter((p) => p.d === c), cat);   // same ranking rule, team only
  const n = team.length;
  const S = team.reduce((a, r) => a + r.s, 0), B = team.reduce((a, r) => a + r.b, 0), A = B > 0 ? S / B * 100 : NaN;
  const hit = team.filter((r) => r.a >= 100).length;
  const dx = ffDsi(m, mk, cat, m.psos.filter((p) => p.d === c));
  // Previous month comparison (same category, same PSO codes)
  const pk = prevMonthKey(mk), pm0 = dataFor(pk), pm = pm0 && catAvail(pm0, cat) ? pm0 : null;
  let cmp = null, salesNote = "";
  if (pm) {
    const prev = new Map(pm.psos.filter((p) => p.d === c).map((p) => [p.p, cat.get(p)[0]]));
    const prevTotal = pm.psos.filter((p) => p.d === c).reduce((a, p) => a + cat.get(p)[0], 0);
    cmp = { label: monthLabel(pk).replace(" 20", " ’"), prev, prevTotal };
    salesNote = `${deltaHtml(S, prevTotal)} vs ${monthLabel(pk)}`;
  }
  const cmpNote = !pm ? `<div class="formula">No ${monthLabel(pk)}${pm0 ? " " + esc(cat.title) : ""} data, so there is no previous-month comparison for ${monthLabel(mk)}.</div>`
    : isRunning(mk) ? `<div class="formula">Compared with ${monthLabel(pk)} month-end sales. ${monthLabel(mk)} is still running (${lowerFirst(upToText(mk))}), so its sales will grow before the month closes.</div>`
    : `<div class="formula">Compared with ${monthLabel(pk)} month-end sales.</div>`;
  return `
    ${catSeg(m, cat)}
    <div class="formula">Achievement = <code>${esc(cat.rule)}</code> · ranked within the team of ${esc(c)} · ${esc(DATA.dsms[c] || "")}</div>
    ${kpis([["Team achievement", pct(A)], ["Team sales (Tk)", tk(S), salesNote], ["Team budget (Tk)", tk(B)], hitKpi(team, dx, hit)])}
    ${dx ? dsiStrip(dsiCalc(S, B, dx.s7tot, dx.ctx), dx.ctx, `${c} team · ${cat.title}`) : ""}
    <div>
      <div class="board-h"><h3><span class="dot" style="--c:var(--accent)"></span>${esc(c)} team · PSO ranking</h3><span>${cat.title} achievement, highest first</span></div>
      ${boardTable(team, { d: c, n, s: S, b: B, a: A }, cmp, dx)}
    </div>
    ${cmpNote}
    <div class="legend"><span style="--c:var(--good)">100%+</span><span style="--c:var(--warn)">90–99%</span><span style="--c:var(--bad)">Below 90%</span><span style="--c:var(--fg)">Budget line (100%)</span></div>`;
}

// ================= REPORT: POWER BRAND TRACKER =================
// DATA.brands.months["2026-09"] = { upTo, final, brands: [names], psos: [{ d, p, n, v: [sales1, budget1, sales2, budget2, ...] }] }
DATA.brands = DATA.brands || { months: {} };
const PB = DATA.brands.months;
const PB_LATEST = Object.keys(PB).sort().pop() || null;
const pbData = (k) => PB[k] || null;
const pbRunning = (k) => k === PB_LATEST && !!PB[k] && !PB[k].final;
const pbUpTo = (k) => { const m = PB[k]; if (!m) return "No data yet"; return m.final ? "Month end" : m.upTo ? `Data up to ${m.upTo}` : "Month to date"; };
const pbBrands = (k) => (PB[k] || PB[PB_LATEST] || { brands: [] }).brands;
function pbRows(m, brand, dsm) {
  const i = m.brands.indexOf(brand); if (i < 0) return [];
  return m.psos.filter((p) => !dsm || p.d === dsm).map((p) => ({ p, s: p.v[2 * i], b: p.v[2 * i + 1] }));
}
// Highest achievement first (ties: higher sales, then smaller budget). Rows with 0 budget cannot be ranked.
function rankRows(rows) {
  const all = rows.map((r) => ({ ...r, a: r.b > 0 ? (r.s / r.b) * 100 : NaN }));
  const ranked = all.filter((r) => isFinite(r.a)).sort((x, y) => y.a - x.a || y.s - x.s || x.b - y.b).map((r, i) => ({ ...r, rank: i + 1 }));
  const unranked = all.filter((r) => !isFinite(r.a)).sort((x, y) => y.s - x.s).map((r) => ({ ...r, rank: "–" }));
  return { ranked, unranked };
}
const sumSB = (rows) => { const S = rows.reduce((a, r) => a + r.s, 0), B = rows.reduce((a, r) => a + r.b, 0); return { S, B, A: B > 0 ? (S / B) * 100 : NaN }; };

// DSI inputs for a Power Brand month (running only): 7th-day sales of one brand per PSO
function pbDsi(m, mk, brand) {
  const ctx = pbRunning(mk) ? dsiCtx(m, mk) : null; if (!ctx) return null;
  const i = m.d7 ? m.d7.brands.indexOf(brand) : -1;
  const d7 = i >= 0 ? new Map(m.d7.psos.map((q) => [q.p, q.v[2 * i] || 0])) : null;
  const s7 = (p) => (!d7 ? null : p.p ? (d7.has(p.p) ? d7.get(p.p) : null) : m.psos.filter((q) => q.d === p.d).reduce((a, q) => a + (d7.get(q.p) || 0), 0));
  return { ctx, s7, s7of: (list) => (d7 ? list.reduce((a, q) => a + (d7.get(q.p) || 0), 0) : null) };
}
function pbPsoTable(rows, dx) {
  return `<div class="tablebox"><table class="pbt${dx ? " dsiw" : ""}">
    <thead><tr><th>Rank</th><th>DSM</th><th>PSO</th><th>PSO name</th><th class="num">Sales (Tk)</th><th class="num">Budget (Tk)</th><th class="num">Ach</th>${dx ? dsiHead() : ""}</tr></thead>
    <tbody>${rows.map((r) => `<tr><td><span class="rk ${r.rank <= 3 ? "top" : ""}">${r.rank}</span></td>
      <td class="code">${esc(r.p.d)}</td><td class="code">${esc(r.p.p)}</td>
      <td class="name">${isVacant(r.p.n) ? `<span style="color:var(--muted)">Vacant</span><span class="vac">Vacant</span>` : esc(r.p.n)}</td>
      <td class="num">${tk(r.s)}</td><td class="num">${tk(r.b)}</td><td class="num"><span class="pill ${tone(r.a)}">${pct(r.a)}</span></td>${dx ? dsiCells(dsiCalc(r.s, r.b, dx.s7(r.p), dx.ctx)) : ""}</tr>`).join("")}</tbody></table></div>`;
}
function pbDsmTable(rows, dx) {
  return `<div class="tablebox"><table class="pbd${dx ? " dsiw" : ""}">
    <thead><tr><th>Rank</th><th>DSM</th><th class="num">Sales (Tk)</th><th class="num">Budget (Tk)</th><th class="num">Ach</th>${dx ? dsiHead() : ""}</tr></thead>
    <tbody>${rows.map((r) => `<tr><td><span class="rk ${r.rank <= 3 ? "top" : ""}">${r.rank}</span></td>
      <td class="dsmc">${esc(r.p.d)}<small>${esc(DATA.dsms[r.p.d] || "")}</small></td>
      <td class="num">${tk(r.s)}</td><td class="num">${tk(r.b)}</td><td class="num"><span class="pill ${tone(r.a)}">${pct(r.a)}</span></td>${dx ? dsiCells(dsiCalc(r.s, r.b, dx.s7(r.p), dx.ctx)) : ""}</tr>`).join("")}</tbody></table></div>`;
}
const pbNoData = (mk) => `<div class="nodata"><b>No Power Brand data for ${monthLabel(mk)} yet</b>This month will appear once its brand file is uploaded.</div>`;
const pbStockNote = (brand, mk, S) => (S === 0 ? `<div class="msg warn"><b>No ${esc(brand)} sales were recorded in ${monthLabel(mk)}, so every PSO shows 0%.</b></div>` : "");

function buildPbLeaderboard(mk, brand) {
  const m = pbData(mk); if (!m) return pbNoData(mk);
  const rows = pbRows(m, brand);
  const { ranked, unranked } = rankRows(rows);
  const { S, B, A } = sumSB(rows);
  const hit = ranked.filter((r) => r.a >= 100).length;
  const top = ranked.slice(0, 10), bottom = ranked.slice(-10).reverse();
  const byDsm = new Map();
  rows.forEach((r) => { const x = byDsm.get(r.p.d) || { p: { d: r.p.d }, s: 0, b: 0 }; x.s += r.s; x.b += r.b; byDsm.set(r.p.d, x); });
  const dsmRank = rankRows([...byDsm.values()]);
  const dx = pbDsi(m, mk, brand);
  return `${pbStockNote(brand, mk, S)}
    <div class="formula">Achievement = <code>${esc(brand)} sales ÷ ${esc(brand)} budget × 100</code> · ranked across ${ranked.length} PSOs of Accela${unranked.length ? ` · ${unranked.length} PSO${unranked.length > 1 ? "s" : ""} with 0 budget not ranked` : ""}</div>
    ${kpis([[`Accela ${esc(brand)} achievement`, pct(A)], [`${esc(brand)} sales (Tk)`, tk(S)], [`${esc(brand)} budget (Tk)`, tk(B)], hitKpi(ranked, dx, hit)])}
    ${dx ? dsiStrip(dsiCalc(S, B, dx.s7of(m.psos), dx.ctx), dx.ctx, `Accela · ${brand}`) : ""}
    <div class="pb-grid${dx ? " pb-stack" : ""}">
      <div class="pb-left">
        <div><div class="board-h"><h3><span class="dot" style="--c:var(--good)"></span>Top 10 PSO</h3><span>Highest ${esc(brand)} achievement</span></div>${pbPsoTable(top, dx)}</div>
        <div><div class="board-h"><h3><span class="dot" style="--c:var(--bad)"></span>Bottom 10 PSO</h3><span>Lowest first</span></div>${pbPsoTable(bottom, dx)}</div>
      </div>
      <div class="pb-right">
        <div class="board-h"><h3><span class="dot" style="--c:var(--accent)"></span>DSM leaderboard</h3><span>All ${dsmRank.ranked.length + dsmRank.unranked.length} DSMs · ${esc(brand)}</span></div>
        ${pbDsmTable([...dsmRank.ranked, ...dsmRank.unranked], dx)}
      </div>
    </div>
    <div class="legend"><span style="--c:var(--good)">100%+</span><span style="--c:var(--warn)">90–99%</span><span style="--c:var(--bad)">Below 90%</span></div>`;
}

function buildPbTeam(mk, brand) {
  const m = pbData(mk); if (!m) return pbNoData(mk);
  const c = state.dsm;
  const rows = pbRows(m, brand, c);
  const { ranked, unranked } = rankRows(rows);
  const { S, B, A } = sumSB(rows);
  const hit = ranked.filter((r) => r.a >= 100).length;
  const pk = prevMonthKey(mk), pm = pbData(pk);
  const dx0 = pbDsi(m, mk, brand), dx = dx0 ? { ...dx0, s7tot: dx0.s7of(rows.map((r) => r.p)) } : null;
  let cmp = null, salesNote = "";
  if (pm && pm.brands.includes(brand)) {

  const cmpNote = !cmp ? `<div class="formula">No ${monthLabel(pk)} brand data yet, so there is no previous-month comparison.</div>`
    : pbRunning(mk) ? `<div class="formula">Compared with ${monthLabel(pk)} month-end sales. ${monthLabel(mk)} is still running (${lowerFirst(pbUpTo(mk))}), so its sales will grow before the month closes.</div>`
    : `<div class="formula">Compared with ${monthLabel(pk)} month-end sales.</div>`;
  return `${pbStockNote(brand, mk, S)}
    <div class="formula">Achievement = <code>${esc(brand)} sales ÷ ${esc(brand)} budget × 100</code> · ranked within the team of ${esc(c)} · ${esc(DATA.dsms[c] || "")}${unranked.length ? " · 0 budget: not ranked" : ""}</div>
    ${kpis([[`Team ${esc(brand)} achievement`, pct(A)], ["Team sales (Tk)", tk(S), salesNote], ["Team budget (Tk)", tk(B)], hitKpi(ranked, dx, hit)])}
    ${dx ? dsiStrip(dsiCalc(S, B, dx.s7tot, dx.ctx), dx.ctx, `${c} team · ${brand}`) : ""}
    <div>
      <div class="board-h"><h3><span class="dot" style="--c:var(--accent)"></span>${esc(c)} team · ${esc(brand)} PSO ranking</h3><span>Highest achievement first</span></div>
      ${boardTable([...ranked, ...unranked], { d: c, n: rows.length, s: S, b: B, a: A }, cmp, dx)}

// ================= ACCELA QUALITY QUEST (QIC+QIS) =================
// DATA.qic.months["2026-08"].rows: [DSM, Name, PSO, Base, Sales, Budget, Ach%, #T12 Ach, T12 brand names, Rx Shr, Dr Cov, Chemist Cov]
// DATA.qic.criteria: [{ from: "2026-06", ach: [[from%, score]], t12: [[score, cat]] (index = brands), rx: [[from%, score, cat]], dr: [target, score], chem: [target, score] }]
// Scoring follows the ACCELA_QIC_Automated_2026 workbook exactly.
DATA.qic = DATA.qic || { criteria: [], months: {} };
const QIC = DATA.qic;
const Q_FIRST = "2026-06";
const qMonthKeys = () => Object.keys(QIC.months).sort();
const Q_LATEST = qMonthKeys().pop() || null;
const critFor = (k, list) => { const l = (list || QIC.criteria).filter((c) => c.from <= k).sort((a, b) => (a.from < b.from ? -1 : 1)); return l.pop() || (list || QIC.criteria)[0]; };
const n0 = (v) => (typeof v === "number" && isFinite(v) ? v : 0);              // blank / N/A count as 0
const r2 = (x) => Math.round((x + (x >= 0 ? 1e-9 : -1e-9)) * 100) / 100;       // Excel ROUND(x, 2)
const fromLookup = (tbl, x) => { let row = tbl[0]; for (const t of tbl) if (x >= t[0]) row = t; return row; };

function scoreRows(rows, crit) {
  const out = rows.map((r, i) => {
    const [d, n, p, base, sales, budget, ach, t12n, t12names, rx, dr, chem] = r;
    const a = n0(ach);
    const achRow = fromLookup(crit.ach, a), band = crit.ach.indexOf(achRow);
    const tn = Math.max(0, Math.min(12, Math.floor(n0(t12n))));
    const [sT12, cT12] = crit.t12[tn];
    const rxRow = fromLookup(crit.rx, n0(rx) * 100);
    const drMet = n0(dr) >= crit.dr[0], chMet = n0(chem) >= crit.chem[0];
    const s = { ach: achRow[1], t12: sT12, rx: rxRow[1], dr: drMet ? crit.dr[1] : 0, chem: chMet ? crit.chem[1] : 0 };
    const total = s.ach + s.t12 + s.rx + s.dr + s.chem;
    return { idx: i + 1, d, n, p, base, sales: n0(sales), budget: n0(budget), ach: a, achRaw: ach, t12n: tn, t12names, rx, dr, chem,
      band, cT12, cRx: rxRow[2], drMet, chMet, s, total,
      code: `${roundUp0(a)}${cT12}${rxRow[2]}${drMet ? "+" : "-"}${chMet ? "+" : "-"}`,
      key: r2(r2(total) * 100000 + r2(a)) };
  });
  // Rank: highest total first; ties → higher Ach %, then PSO code (same as the workbook)
  const lc = (x) => String(x).toLowerCase();
  out.forEach((x) => { x.rank = out.filter((y) => y.key > x.key || (y.key === x.key && lc(y.p) < lc(x.p))).length + 1; });
  return out;
}
const Q_CACHE = {};
const qScored = (k) => (QIC.months[k] ? (Q_CACHE[k] = Q_CACHE[k] || scoreRows(QIC.months[k].rows, critFor(k))) : null);
const qPrevKey = (k) => qMonthKeys().filter((m) => m < k).pop() || null;
const qMax = (crit) => ({ ach: Math.max(...crit.ach.map((x) => x[1])), t12: Math.max(...crit.t12.map((x) => x[0])), rx: Math.max(...crit.rx.map((x) => x[1])), dr: crit.dr[1], chem: crit.chem[1] });

// Category labels built from the criteria, e.g. "≥ 100%", "A (10–12 brands)", "B (8–<10%)"
function qLabels(crit) {
  const t = crit.ach.map((x) => x[0]);
  const sales = crit.ach.map((_, i) => (i === t.length - 1 ? `≥ ${t[i]}%` : i === 0 ? `< ${t[1]}%` : `${t[i]}% – <${t[i + 1]}%`)).reverse(); // top band first
  const cats = ["A", "B", "C", "D", "E"];
  const t12 = cats.map((c) => { const ns = crit.t12.map((x, n) => (x[1] === c ? n : -1)).filter((n) => n >= 0); if (!ns.length) return `${c}`; const a = Math.min(...ns), b = Math.max(...ns); return `${c} (${a === b ? a : a + "–" + b}${c === "A" || a !== b ? " brands" : b === 1 ? " brand" : " brands"})`; });
  const rxs = [...crit.rx].sort((a, b) => b[0] - a[0]);
  const rx = cats.map((c) => { const i = rxs.findIndex((x) => x[2] === c); if (i < 0) return c; const lo = rxs[i][0], hi = i > 0 ? rxs[i - 1][0] : null; return `${c} (${hi == null ? "≥" + lo + "%" : lo === 0 ? "<" + hi + "%" : lo + "–<" + hi + "%"})`; });
  return { sales, t12, rx, dr: [`Met (≥ ${Math.round(crit.dr[0] * 100)}%)`, `Not met (< ${Math.round(crit.dr[0] * 100)}%)`], chem: [`Met (≥ ${Math.round(crit.chem[0] * 100)}%)`, `Not met (< ${Math.round(crit.chem[0] * 100)}%)`] };
}
// Counts per category for one month (optionally one DSM)
function qCounts(k, dsm) {
  const rows = (qScored(k) || []).filter((x) => !dsm || x.d === dsm);
  const crit = critFor(k), nb = crit.ach.length;
  const sales = Array.from({ length: nb }, (_, i) => rows.filter((x) => x.band === nb - 1 - i).length);
  const by = (f, c) => rows.filter((x) => x[f] === c).length;
  return { n: rows.length, sales, t12: ["A", "B", "C", "D", "E"].map((c) => by("cT12", c)), rx: ["A", "B", "C", "D", "E"].map((c) => by("cRx", c)),
    dr: [rows.filter((x) => x.drMet).length, rows.filter((x) => !x.drMet).length], chem: [rows.filter((x) => x.chMet).length, rows.filter((x) => !x.chMet).length] };
}
function qKpis(k, dsm) {
  const rows = (qScored(k) || []).filter((x) => !dsm || x.d === dsm);
  if (!rows.length) return null;
  const S = rows.reduce((a, x) => a + x.sales, 0), B = rows.reduce((a, x) => a + x.budget, 0);
  const top = rows.reduce((a, x) => (!a || x.rank < a.rank ? x : a), null);
  return { n: rows.length, avg: r2(rows.reduce((a, x) => a + x.total, 0) / rows.length), ach: B ? Math.round((S / B) * 1000) / 10 : 0,
    hit: rows.filter((x) => x.band === critFor(k).ach.length - 1).length, top, rows };
}
// Improvers / drops vs the previous month with data (same as the workbook: only PSOs in both months; ties by row order)
function qMovers(k, dsm) {

  const prev = new Map(qScored(pk).map((x) => [x.p, x]));
  const list = qScored(k).filter((x) => prev.has(x.p) && (!dsm || x.d === dsm)).map((x) => { const pv = prev.get(x.p); const ch = r2(x.total - pv.total); return { x, pv, ch, key: ch + x.idx / 1e6 }; });
  return { pk, improved: list.filter((m) => m.ch > 0).length, dropped: list.filter((m) => m.ch < 0).length, same: list.filter((m) => m.ch === 0).length, compared: list.length,
    up: list.filter((m) => m.key > 0.005).sort((a, b) => b.key - a.key).slice(0, 10), down: list.filter((m) => m.key < -0.005).sort((a, b) => a.key - b.key).slice(0, 10) };
}

// ---------- small SVG chart helpers (one measure per chart, hover tooltips) ----------
const QSEQ = ["var(--q1)", "var(--q2)", "var(--q3)", "var(--q4)", "var(--q5)"];   // A green · B blue · C yellow · D purple · E red
function lineChart(points, opt) {
  // points: [{label, v}] ; v null = no data
  const W = opt.w || 520, H = opt.h || 190, L = 40, R = 30, T = 20, Bm = 26;
  const vals = points.filter((p) => p.v != null).map((p) => p.v);

  const lo = opt.min != null ? opt.min : Math.min(...vals), hi0 = opt.max != null ? opt.max : Math.max(...vals);
  const step = opt.step || niceStep(hi0 - lo);
  const yMin = Math.floor(lo / step) * step, yMax = Math.max(yMin + step, Math.ceil(hi0 / step) * step);
  const x = (i) => L + (points.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (points.length - 1));
  const y = (v) => T + (H - T - Bm) * (1 - (v - yMin) / (yMax - yMin));

  const segs = []; let cur = [];
  points.forEach((p, i) => { if (p.v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(p.v)]); });
  if (cur.length) segs.push(cur);

function niceStep(range) { const r = Math.max(range, 1) / 4; const p = Math.pow(10, Math.floor(Math.log10(r))); const m = r / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }

function stackChart(cols, labels, opt) {

// ================= RX ANALYTICS HUB · 4P MIRROR =================
// DATA.rx = latest 4P raw file only (rows with an ACC PSO): { month, cycle, file, totalRows,
//   dict: { doc: [[PHY_ID, PHY_NM]], spc: [], ch: [], ing: [], comp: [], pso: [[PSO, DSM, BASE, REGION]] },
//   rows: [[PRS_TYPE, doc, spc, ch, ing, pso, comp], ...] in raw-file order }
// DATA.rxTop = ACC TOP 12 molecule list (from the SETTINGS sheet).
// Every report follows the ACC Raw File master workbook's formulas.
const RX = DATA.rx || null;
DATA.rxTop = DATA.rxTop || [];
const RXD = RX ? RX.dict : null;
const RX_RNT = RX ? RXD.comp.indexOf("RNT") : -1;
// Excel's text sort order: hyphens and apostrophes ignored, then space and symbols, digits, letters (case-insensitive)
const RX_ORDER = " !\"#$%&()*,./:;?@[\\]^_`{|}~+<=>0123456789abcdefghijklmnopqrstuvwxyz";
const rxKey = (s) => { const k = []; for (const ch of String(s).toLowerCase()) { if (ch === "-" || ch === "'") continue; const i = RX_ORDER.indexOf(ch); k.push(i < 0 ? 100 + ch.codePointAt(0) : i); } return k; };
const rxKeyCache = new Map();
const rxCmp = (a, b) => { let ka = rxKeyCache.get(a); if (!ka) { ka = rxKey(a); rxKeyCache.set(a, ka); } let kb = rxKeyCache.get(b); if (!kb) { kb = rxKey(b); rxKeyCache.set(b, kb); }
  const n = Math.min(ka.length, kb.length); for (let i = 0; i < n; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i]; return ka.length - kb.length; };
const ORD = (n) => n + (["th", "st", "nd", "rd"][((n % 100) - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const rxCycleText = (c) => (String(c).toUpperCase() === "FINAL" ? "FINAL" : `${ORD(+c)} cycle`);
const rxLabel = () => { if (!RX) return ""; const [y, m] = RX.month.split("-").map(Number); return `${new Date(y, m - 1, 1).toLocaleString("en-US", { month: "long" })} ${y} · ${rxCycleText(RX.cycle)}`; };
const rxTopSet = () => new Set(DATA.rxTop.map((x) => String(x).trim().toUpperCase()));
const rxDsmOf = (r) => RXD.pso[r[5]][1];
// rows with an ACC PSO, filtered by ING / DSM / PRS_TYPE 1
function rxFilter(f) {
  const out = [];
  const ingI = f.ing ? RXD.ing.findIndex((x) => x.toUpperCase() === f.ing.toUpperCase()) : -1;
  if (f.ing && ingI < 0) return out;
  const top = f.top ? rxTopSet() : null;
  RX.rows.forEach((r, i) => {
    if (f.type1 && r[0] !== 1) return;
    if (f.ing && r[4] !== ingI) return;
    if (f.dsm && rxDsmOf(r) !== f.dsm) return;
    if (top && !top.has(RXD.ing[r[4]].toUpperCase())) return;
    out.push(i);
  });
  return out;
}

// RX SHARE — PRS_TYPE 1 only; by ACC DSM and by ACC PSO; RNT rank = 1 + companies with more Rx in that territory
function rxShare(dsm) {
  const rows = rxFilter({ type1: true, dsm });
  const grp = (keyFn) => { const m = new Map(); rows.forEach((i) => { const r = RX.rows[i], k = keyFn(r); let g = m.get(k); if (!g) { g = { tot: 0, rnt: 0, comps: new Map() }; m.set(k, g); } g.tot++; if (r[6] === RX_RNT) g.rnt++; g.comps.set(r[6], (g.comps.get(r[6]) || 0) + 1); }); return m; };
  const fin = (g) => ({ rnt: g.rnt, tot: g.tot, shr: g.tot ? g.rnt / g.tot : NaN, rank: 1 + [...g.comps.values()].filter((c) => c > g.rnt).length });
  const bd = grp((r) => rxDsmOf(r)), bp = grp((r) => RXD.pso[r[5]][0] + "\u0001" + rxDsmOf(r));
  const dsms = [...bd.entries()].map(([d, g]) => ({ dsm: d, ...fin(g) })).sort((a, b) => rxCmp(a.dsm, b.dsm));
  const psos = [...bp.entries()].map(([k, g]) => { const [p, d] = k.split("\u0001"); return { dsm: d, pso: p, ...fin(g) }; }).sort((a, b) => rxCmp(a.dsm, b.dsm) || rxCmp(a.pso, b.pso));
  const rnt = rows.filter((i) => RX.rows[i][6] === RX_RNT).length;
  return { dsms, psos, total: { rnt, tot: rows.length, shr: rows.length ? rnt / rows.length : NaN } };
}
// SEGMENT-WISE — PRS_TYPE 1 only (named doctors); doctor specialty; competitors listed in order of first appearance (only when more than one)
function rxSegment(ing, dsm) {
  const rows = rxFilter({ type1: true, ing, dsm }), m = new Map();
  rows.forEach((i) => { const r = RX.rows[i]; const seg = RXD.spc[r[2]] || "(No specialty)"; const k = seg.toUpperCase();
    let g = m.get(k); if (!g) { g = { seg, tot: 0, rnt: 0, comps: [] }; m.set(k, g); }
    g.tot++; if (r[6] === RX_RNT) g.rnt++; else if (!g.comps.includes(r[6])) g.comps.push(r[6]); });
  const list = [...m.values()].map((g) => ({ seg: g.seg, rnt: g.rnt, oth: g.tot - g.rnt, tot: g.tot, shr: g.tot ? g.rnt / g.tot : NaN, comps: g.comps.length > 1 ? g.comps.map((c) => RXD.comp[c]).join(", ") : "" }))
    .sort((a, b) => b.tot - a.tot || rxCmp(a.seg, b.seg));
  const R = list.reduce((a, x) => a + x.rnt, 0), O = list.reduce((a, x) => a + x.oth, 0);
  return { list, total: { rnt: R, oth: O, shr: R + O ? R / (R + O) : NaN } };
}
// COMPANY-WISE — PRS_TYPE 1 only; every company ranked by Rx count (ties share a rank)
function rxCompany(ing, dsm) {
  const rows = rxFilter({ type1: true, ing, dsm }), m = new Map();
  rows.forEach((i) => { const c = RX.rows[i][6]; m.set(c, (m.get(c) || 0) + 1); });
  const list = [...m.entries()].map(([c, n]) => ({ comp: RXD.comp[c], n })).sort((a, b) => b.n - a.n || rxCmp(a.comp, b.comp));
  const total = rows.length;
  list.forEach((x, i) => { x.shr = total ? x.n / total : NaN; x.rank = list.findIndex((y) => y.n === x.n) + 1; });
  return { list, total };
}
// PRESCRIBER ANALYSIS — one row per doctor × ACC TOP 12 molecule; doctor = PHY_ID, or PHY_NM when there is no ID
function rxPrescriber(ing, dsm) {
  const rows = rxFilter({ ing, dsm, top: true }), m = new Map();
  rows.forEach((i) => { const r = RX.rows[i], [pid, pnm] = RXD.doc[r[1]]; const key = (pid || pnm).toUpperCase() + "\u0001" + RXD.ing[r[4]].toUpperCase();
    let g = m.get(key); if (!g) { g = { first: r, rnt: 0, tot: 0, comps: [] }; m.set(key, g); }
    g.tot++; if (r[6] === RX_RNT) g.rnt++; else if (!g.comps.includes(r[6])) g.comps.push(r[6]); });
  return [...m.values()].map((g) => { const r = g.first, [pid, pnm] = RXD.doc[r[1]], [pso, d, base, region] = RXD.pso[r[5]];
    return { name: pnm, id: pid, spc: RXD.spc[r[2]], ing: RXD.ing[r[4]], ch: RXD.ch[r[3]], pso, dsm: d, base, region, rnt: g.rnt, oth: g.tot - g.rnt, shr: g.tot ? g.rnt / g.tot : NaN, comps: g.comps.length > 1 ? g.comps.map((c) => RXD.comp[c]).join(", ") : "" }; })
    .sort((a, b) => rxCmp(a.dsm, b.dsm) || rxCmp(a.pso, b.pso) || rxCmp(a.name, b.name) || rxCmp(a.id, b.id) || rxCmp(a.ing, b.ing));
}

// ================= RX ANALYTICS HUB · MONTHLY PRODUCT SHARE TREND 2026 =================
// DATA.trend = { dict: { pso: [[PSO, DSM]] (["",""] = no ACC PSO), ing: [] },
//   months: { "2026-01": { rows: [[pso, ing, strategic 0/1, RNT Rx, total Rx]], src } } }
// Counts are PRS_TYPE 1 prescriptions (count of QT_PRS). DATA.trInh = inhaler molecules.
const TR = DATA.trend || { dict: { pso: [], ing: [] }, months: {} };
DATA.trInh = DATA.trInh || [];
const TR_TABS = [
  { id: "all", title: "All Products", note: "all molecules" },
  { id: "pri", title: "Priority Products", note: "all molecules except the Strategic products (Meropenem, Piperacillin+Tazobactam)" },
  { id: "t12", title: "Top 12 Brand", note: "ACC TOP 12 molecules" },
  { id: "inh", title: "Inhaler", note: "inhaler molecules" },
];
const trMonths = () => Object.keys(TR.months).sort();
const MONTH_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const trMon = (k) => MONTH_LONG[+k.slice(5) - 1].slice(0, 3);
state.trTab = "all"; state.trArea = ""; state.trIng = "";

// which molecules a tab + molecule choice covers (null = every molecule)
function trIngSet(tab, ing) {
  const up = (x) => String(x).toUpperCase();
  const top = new Set(DATA.rxTop.map(up)), inh = new Set(DATA.trInh.map(up));
  return TR.dict.ing.map((n) => {
    const u = up(n);
    if (tab === "t12" && !top.has(u)) return false;
    if (tab === "inh" && !inh.has(u)) return false;
    if (ing) return u === up(ing);
    return true;
  });
}
// one pass over the months: totals per key (area rows) and per month
function trCompute(tab, ing, area) {
  const ok = trIngSet(tab, ing), P = TR.dict.pso, months = trMonths();
  const cell = () => ({ r: 0, t: 0 });
  const rows = new Map(), add = (key, mi, r, t) => { let o = rows.get(key); if (!o) { o = { m: months.map(cell), y: cell() }; rows.set(key, o); } o.m[mi].r += r; o.m[mi].t += t; o.y.r += r; o.y.t += t; };
  months.forEach((mk, mi) => {
    for (const [pi, ii, s, r, t] of TR.months[mk].rows) {
      if (!ok[ii] || (tab === "pri" && s)) continue;
      const [p, d] = P[pi], acc = !!p;
      add("NAT", mi, r, t);
      add(acc ? "ACC" : "NON", mi, r, t);
      if (!acc) continue;
      add("D:" + d, mi, r, t);
      if (area && area !== "__NAT" && d === area) add("P:" + p, mi, r, t);
    }
  });
  return { months, rows };
}
const trShare = (c) => (c && c.t ? c.r / c.t : null);
const trPct = (v) => (v == null ? "–" : (v * 100).toFixed(1) + "%");
const trPP = (v) => (v == null ? "" : `${v >= 0 ? "▲" : "▼"} ${Math.abs(v * 100).toFixed(1)} pts`);
const psoNames = () => { const m = {}; Object.keys(DATA.months).sort().forEach((k) => DATA.months[k].psos.forEach((p) => (m[p.p] = p.n))); return m; };
const trAreaName = (a) => (a === "" ? "Accela National" : a === "__NAT" ? "NATIONAL" : `${a} · ${dsmName(a)}`);

// two-line chart: the selection (accent) and a reference line (muted, dashed)
function trLine(months, main, ref, refName) {
  const W = 640, H = 230, L = 46, R = 64, T = 22, B = 28;
  const vals = [...main, ...ref].filter((v) => v != null);
  if (!vals.length) return `<div class="muted">No data for this selection.</div>`;
  const hi = Math.max(...vals), step = niceStep(hi * 100) / 100, yMax = Math.max(step, Math.ceil(hi / step) * step);
  const x = (i) => L + (months.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (months.length - 1));
  const y = (v) => T + (H - T - B) * (1 - v / yMax);
  const ticks = []; for (let v = 0; v <= yMax + 1e-9; v += step) ticks.push(v);
  const path = (arr) => { const segs = []; let cur = []; arr.forEach((v, i) => { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push(`${x(i)},${y(v)}`); }); if (cur.length) segs.push(cur); return segs; };
  const last = (arr) => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return i; return -1; };
  const lm = last(main);
  return `<svg class="qchart trchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly RNT product share">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 8}" y="${y(v) + 4}" class="axis" text-anchor="end">${(v * 100).toFixed(step < 0.01 ? 1 : 0)}%</text>`).join("")}
    ${months.map((m, i) => `<text x="${x(i)}" y="${H - 8}" class="axis" text-anchor="middle">${trMon(m)}</text>`).join("")}
    ${path(ref).map((s) => `<polyline points="${s.join(" ")}" class="ln ref"/>`).join("")}
    ${path(main).map((s) => `<polyline points="${s.join(" ")}" class="ln"/>`).join("")}
    ${ref.map((v, i) => (v == null ? "" : `<g data-tip="${refName} · ${trMon(months[i])}: ${trPct(v)}"><circle cx="${x(i)}" cy="${y(v)}" r="10" class="hit"/><circle cx="${x(i)}" cy="${y(v)}" r="3" class="dot ref"/></g>`)).join("")}
    ${main.map((v, i) => (v == null ? "" : `<g data-tip="${trMon(months[i])}: ${trPct(v)}"><circle cx="${x(i)}" cy="${y(v)}" r="12" class="hit"/><circle cx="${x(i)}" cy="${y(v)}" r="4.5" class="dot"/></g>`)).join("")}
    ${lm >= 0 ? `<text x="${x(lm) + 8}" y="${y(main[lm]) + 4}" class="val">${trPct(main[lm])}</text>` : ""}
  </svg>`;
}

function buildTrend() {

  const refKey = area === "" ? "NAT" : "ACC", refName = area === "" ? "NATIONAL" : "Accela National";

  const cur = ms[li], prev = pi >= 0 ? ms[pi] : null, ytd = trShare(M && M.y);
  let best = -1; ms.forEach((v, i) => { if (v != null && (best < 0 || v > ms[best])) best = i; });
  const ingTxt = ing || "All molecules";
  // table rows
  const names = psoNames();
  let body = [];
  const row = (cls, label, sub, c, extra = "") => {
    const vals = months.map((_, i) => trShare(c && c.m[i]));
    const d = vals[li] != null && pi >= 0 && vals[pi] != null ? vals[li] - vals[pi] : null;
    return `<tr class="${cls}"><td class="trl">${label}${sub ? `<small>${esc(sub)}</small>` : ""}</td>${vals.map((v, i) => `<td class="num trc" style="--h:${v == null ? 0 : Math.min(1, v / heatMax)}" data-tip="${esc(String(label).replace(/<[^>]+>/g, ""))} · ${MONTH_LONG[+months[i].slice(5) - 1]}: ${c && c.m[i].t ? `RNT ${nfmt(c.m[i].r)} of ${nfmt(c.m[i].t)} Rx` : "no Rx"}">${trPct(v)}</td>`).join("")}
      <td class="num try">${trPct(trShare(c && c.y))}</td><td class="num trd ${d == null ? "" : d >= 0 ? "up" : "down"}">${trPP(d)}</td>${extra}</tr>`;

// budget and last-year value for one raw line; prevY = previous month's derived YTD [budget, ly]
function apdDerive(raw, prevY, first) {
  if (!raw) return null;
  const [s, a, g, ys, ya, yg] = raw;
  const bud = (v, p) => (p ? (v * 100) / p : null), ly = (v, p) => (p === 0 ? 0 : p === -100 ? null : v / (1 + p / 100));
  const yb = bud(ys, ya), yl = ly(ys, yg);

  if (l == null && yl != null) l = first ? yl : prevY && prevY[1] != null ? yl - prevY[1] : null;
  return { m: [s, b, l], y: [ys, yb, yl] };
}
// derived numbers for every month/area/brand, computed once
const APD_D = (() => {
  const out = {}, keys = apdMonths();
  keys.forEach((k, i) => {
    const pk = keys[i - 1], prev = pk && +pk.slice(0, 4) === +k.slice(0, 4) && pk === addMonthsQ(k, -1) ? out[pk] : null;
    const first = k.slice(5) === "01";

      out[k][br] = {};
      ["n", "a", "d"].forEach((z) => { const p = prev && prev[br] && prev[br][z]; out[k][br][z] = apdDerive(ar[z], p ? p.y.slice(1) : null, first); });
    });

})();
// [sales, budget, ly] for one brand/area in a month ("m") or year-to-date ("y")
function apdVal(k, br, z, mode) {

  return d[z] ? d[z][mode] : null;

const apdSum = (list) => { if (!list.some(Boolean)) return null; let s = 0, b = 0, l = 0; list.forEach((v) => { if (!v) return; s += v[0]; b += v[1] || 0; l += v[2] || 0; }); return [s, b, l]; };

const apdBar = (a) => `<div class="bar"><i class="${tone(a)}" style="width:${isFinite(a) ? Math.max(0, Math.min((a / 150) * 100, 100)) : 0}%"></i><span class="tgt" style="left:${(100 / 150) * 100}%"></span></div>`;
const apdUpTo = (k) => { const m = APD.months[k]; return !m ? "" : m.final ? "Month end" : m.upTo ? `Data up to ${m.upTo}` : "Month to date"; };
const apdRunning = (k) => !!APD.months[k] && !APD.months[k].final;

function buildAPD() {
  if (!APD_LATEST) return `<div class="nodata"><b>No portfolio data yet</b>Upload the Brand Wise National report and the ACC NAT and ACC DHAKA trend files in the Upload Center.</div>`;

    ${dctx ? dsiStrip(dcalc(APD_AREAS.find((A) => A.id === "a"), tot.a), dctx, `Accela · ${cat.title}`) : ""}

// ---------- Upload: Brand wise National report(s) + ACC NAT / ACC DHAKA trend files, all at once ----------
const APD_MON = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
function apdCheck(X, files, ctx) {
  const errors = [], warnings = [], got = {};   // got[monthKey] = { n, a, d } each { rows: {BRAND: raw}, names }
  const selY = +ctx.month.slice(0, 4), selM = +ctx.month.slice(5, 7);
  const num = (v) => (typeof v === "number" ? v : v == null || v === "" ? 0 : parseFloat(String(v).replace(/,/g, "")) || 0);
  const put = (k, z, rows, names, file) => { got[k] = got[k] || {}; if (got[k][z]) warnings.push(`${monthLabel(k)} ${z === "n" ? "national" : z === "a" ? "ACC NAT" : "ACC DHAKA"} figures appear in more than one file; "${file}" was used.`); got[k][z] = { rows, names, file }; };
  let upToNat = null;
  for (const f of files) {
    const wb = X.read(f.buf, { type: "array" });
    const all = wb.SheetNames.map((n) => ({ n, g: X.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: null, raw: true }) }));
    const text = all.flatMap((s) => s.g.slice(0, 12).flat()).filter((v) => typeof v === "string").join(" ");
    if (/brand\s*wise\s*national/i.test(text) || all.some((s) => s.g.some((r) => r && r.some((c) => norm(c) === "PRODUCTNAME") && r.some((c) => norm(c) === "MTDAMOUNT")))) {
      // Brand wise National Sales Report: month from "Month : September 30, 2026"
      const mm = text.match(/Month\s*:\s*([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})/);
      if (!mm) { errors.push(`"${f.name}": couldn't find the "Month : <month> <day>, <year>" line.`); continue; }
      const mi = APD_MON.findIndex((w) => w.startsWith(mm[1].toUpperCase().slice(0, 3)));
      const key = `${mm[3]}-${String(mi + 1).padStart(2, "0")}`;
      const sh = all.find((s) => s.g.some((r) => r && r.some((c) => norm(c) === "PRODUCTNAME") && r.some((c) => norm(c) === "MTDAMOUNT")));
      if (!sh) { errors.push(`"${f.name}": no sheet with PRODUCT NAME and MTD AMOUNT headings in one row (the report's Sheet2).`); continue; }
      const hi = sh.g.findIndex((r) => r && r.some((c) => norm(c) === "PRODUCTNAME")), H = sh.g[hi].map(norm);
      const idx = ["PRODUCTNAME", "MTDAMOUNT", "MTD%ACH", "MTD%GR", "YTDAMOUNT", "YTD%ACH", "YTD%GR"].map((h) => H.indexOf(h));
      if (idx.some((i) => i < 0)) { errors.push(`"${f.name}": missing column(s) ${["PRODUCT NAME", "MTD AMOUNT", "MTD %ACH", "MTD %GR", "YTD AMOUNT", "YTD %ACH", "YTD %GR"].filter((_, j) => idx[j] < 0).join(", ")}.`); continue; }
      const rows = {}, names = {};
      sh.g.slice(hi + 1).forEach((r) => { const nm = r && r[idx[0]]; if (!nm || /^TOTAL/i.test(String(nm).trim())) return; const b = String(nm).trim().toUpperCase(); rows[b] = idx.slice(1).map((i) => Math.round(num(r[i]) * 1e4) / 1e4); names[b] = String(nm).trim(); });
      put(key, "n", rows, names, f.name);
      if (key === ctx.month) upToNat = `${+mm[2]} ${MON[mi]} ${mm[3]}`;
      continue;
    }
    // Daily dashboard workbook (v3.3): sheets NATIONAL / ACCELA NAT / ACCELA DHAKA, each with a
    // BRAND · MTD SALES · MTD ACH · MTD GR · YTD SALES · YTD %ACH · YTD %GR table, for the month picked in the form
    const dsheets = all.filter((s) => s.g.slice(0, 5).some((r) => r && norm(r[0]) === "BRAND" && r.some((c) => norm(c) === "MTDSALES")));
    if (dsheets.length) {
      let used = 0;
      for (const s of dsheets) {
        const nm = norm(s.n), zz = /DHAKA|DHK/.test(nm) ? "d" : /ACC/.test(nm) ? "a" : /NAT/.test(nm) ? "n" : null;
        if (!zz) { warnings.push(`"${f.name}": sheet "${s.n}" skipped — its name should say NATIONAL, ACCELA NAT or ACCELA DHAKA.`); continue; }
        const hi = s.g.findIndex((r) => r && norm(r[0]) === "BRAND"), rows = {}, names = {};
        s.g.slice(hi + 1).forEach((r) => { if (!r || !r[0] || typeof r[1] !== "number" || /^(GRAND|TOTAL|PAGE)/i.test(String(r[0]).trim())) return;
          const b = String(r[0]).trim().toUpperCase(); rows[b] = r.slice(1, 7).map((v) => Math.round(num(v) * 1e4) / 1e4); names[b] = String(r[0]).trim(); });
        if (Object.keys(rows).length) { put(ctx.month, zz, rows, names, `${f.name} · ${s.n}`); used++; }
      }
      if (!used) errors.push(`"${f.name}": found the BRAND / MTD SALES tables but no brand rows in them.`);
      continue;
    }
    // ACC trend file: month-named sheets, rows = [brand, MTD, %Ach, %Gr, YTD, %Ach, %Gr]
    const z = /DHAKA|DHK/i.test(f.name) ? "d" : /NAT/i.test(f.name) ? "a" : null;

// ---------- 3. Doctor profile ----------

// ---------- 4. Brand focus ----------

// ---------- 5. Territory scorecard ----------
function buildPTS() {
  if (!PRX) return prNoData();
  const rows = prScope(), D = PR.dict, byPso = !!state.prDsm;
  const groups = new Map();
  rows.forEach((r) => { const keys = byPso ? [...r.psos].map((p) => D.pso[p]) : [D.dsm[r.dsm][0]];
    keys.forEach((k) => { let g = groups.get(k); if (!g) { g = { k, docs: new Set(), p1: new Set(), T: 0, R: 0, T25: 0, R25: 0, c1: 0, lost: new Set(), gained: new Set() }; groups.set(k, g); }
      if (r.t26 > 0) g.docs.add(r.doc); g.T += r.t26; g.R += r.r26; g.T25 += r.t25; g.R25 += r.r25; if (r.pri === 1) { g.p1.add(r.doc); g.c1 += r.c26; } if (r.seg === 3 || r.seg === 12) g.lost.add(r.doc); if (r.seg === 10) g.gained.add(r.doc); }); });
  const list = [...groups.values()].sort((a, b) => b.c1 - a.c1);

    <tbody>${list.map((g) => { const s = prShare(g.R, g.T), s0 = prShare(g.R25, g.T25), dd = isFinite(s) && isFinite(s0) ? s - s0 : NaN;
      return `<tr ${byPso ? "" : `class="prclick" data-prdsm="${esc(g.k)}"`}><td class="code"><b>${esc(g.k)}</b>${byPso ? "" : `<small>${esc(DATA.dsms[g.k] || "")}</small>`}</td><td class="num">${nfmt(g.docs.size)}</td><td class="num">${nfmt(g.T)}</td><td class="num">${nfmt(g.R)}</td>
      <td class="num"><b>${prPct(s)}</b></td><td class="num">${isFinite(dd) ? `<span class="${dd >= 0 ? "up" : "down"}">${dd >= 0 ? "▲" : "▼"} ${Math.abs(dd).toFixed(1)}</span>` : "–"}</td><td class="num">${nfmt(g.p1.size)}</td>
      <td class="prbarc"><div class="prbarw"><span class="prr-bar"><i class="p1" style="width:${(g.c1 / maxC) * 100}%"></i></span><b>${nfmt(g.c1)}</b></div></td><td class="num">${nfmt(g.gained.size)}</td><td class="num">${nfmt(g.lost.size)}</td></tr>`; }).join("")}</tbody></table></div></div>
  </div>`;
}

// ================= GITHUB PUBLISHING (only when the portal runs on GitHub Pages) =================
// The page then holds {"src":"data.json","gh":{owner,repo,branch,path}}. Publishing writes the encrypted
// data to data.json through the GitHub API with the admin's GitHub key. The key is kept on the admin's
// own device only, locked with the admin password.
const GH = (window.__A1 && window.__A1.host && window.__A1.host.gh) || null;
const GH_SAVED = "a1-gh-key", GH_SESSION = "a1-gh-key-s";
const ghTok = () => { try { return sessionStorage.getItem(GH_SESSION); } catch (e) { return null; } };
const ghErr = (code) => Object.assign(new Error(code), { code });
async function ghUnlock(pw) {   // admin password typed: open the saved GitHub key for this browser session
  if (!GH) return;
  try { const box = localStorage.getItem(GH_SAVED); if (box) sessionStorage.setItem(GH_SESSION, (await window.__A1.unseal(box, pw)).k); } catch (e) {}
}
async function ghRewrap(pw) {   // admin password changed: lock the saved key with the new password
  const t = ghTok(); if (!GH || !t) return;
  try { localStorage.setItem(GH_SAVED, await window.__A1.seal({ k: t }, pw)); } catch (e) {}
}
function ghBanner(cls, html) {
  let b = document.getElementById("gh-status");
  if (!b) { b = document.createElement("div"); b.id = "gh-status"; document.body.appendChild(b); }
  b.className = "gh-status " + cls; b.innerHTML = html; b.hidden = !html;
}
async function ghApi(path, opt = {}) {
  return fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}${path}`, { ...opt, cache: "no-store",
    headers: { Authorization: `Bearer ${opt.token || ghTok()}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opt.body ? { "Content-Type": "application/json" } : {}) } });
}
async function ghPublish(sealed) {
  if (!ghTok()) { ghBanner("bad", "<b>Not published.</b> Connect GitHub first: open the Upload Center and fill in the GitHub card."); throw ghErr("no_token"); }
  ghBanner("run", "<b>Saving to GitHub…</b>");
  const file = `/contents/${GH.path}`;
  const r0 = await ghApi(`${file}?ref=${GH.branch}`);
  if (r0.status === 401 || r0.status === 403) { ghBanner("bad", "<b>Not published.</b> GitHub refused the key. It may have expired. Disconnect and connect again with a new key."); throw ghErr("bad_token"); }
  const sha = r0.ok ? (await r0.json()).sha : undefined;
  const r = await ghApi(file, { method: "PUT", body: JSON.stringify({ message: `ACCELA ONE data update ${new Date().toISOString().slice(0, 16).replace("T", " ")}`, content: btoa(sealed), branch: GH.branch, sha }) });
  if (!r.ok) {
    ghBanner("bad", r.status === 409 ? "<b>Not published.</b> The data changed on GitHub a moment ago. Reload the page and try again."
      : (r.status === 401 || r.status === 403) ? "<b>Not published.</b> GitHub refused the key. Check that it can write to this repository."
      : "<b>Not published.</b> GitHub did not accept the upload. Try again in a minute.");
    throw ghErr(r.status === 409 ? "conflict" : "gh_failed");
  }
  // GitHub takes a minute or two to put the new file live. Wait for it, then reload with the new numbers.
  const iv = JSON.parse(sealed).iv, t0 = Date.now();
  while (Date.now() - t0 < 240000) {
    const secs = Math.round((Date.now() - t0) / 1000);
    ghBanner("run", `<b>Saved to GitHub.</b> Waiting for the site to update… ${secs}s`);
    await new Promise((res) => setTimeout(res, 6000));
    try { const live = await (await fetch(`${GH.path}?v=${Date.now()}`, { cache: "no-store" })).json(); if (live.iv === iv) break; } catch (e) {}
  }
  ghBanner("ok", "<b>Published.</b> Reloading with the new numbers…");
  setTimeout(() => location.reload(), 600);
  await new Promise(() => {});   // the page reloads
}
async function publishSealed(sealed) {
  if (GH) return ghPublish(sealed);
  return ADMIN.art.publish(buildDocument(sealed));
}
function ghCard() {
  if (!GH) return "";
  const t = ghTok();
  return `<div class="hub-card pw-card gh-card"><div class="dir-h">GitHub connection</div>
    ${t ? `<p class="muted">Connected to <b>${esc(GH.owner)}/${esc(GH.repo)}</b>. Publishing saves straight to GitHub, and the site updates in a minute or two.</p>
      <div><button class="btn" type="button" id="gh-off">Disconnect this device</button></div>`
    : `<p class="muted">Publishing needs your GitHub key for <b>${esc(GH.owner)}/${esc(GH.repo)}</b>. It is kept only on this device, locked with your admin password.</p>
      <form class="pw-row" id="gh-form" autocomplete="off">
        <div class="field"><label class="lbl" for="gh-key">GitHub key</label><input id="gh-key" type="password" autocomplete="off" spellcheck="false" required></div>
        <div class="field"><label class="lbl" for="gh-apw">Admin password</label><input id="gh-apw" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" id="gh-go" type="submit">Connect GitHub</button>
      </form>`}
    <div id="gh-msg"></div></div>`;
}
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "gh-form") return;
  e.preventDefault();
  const key = $("#gh-key").value.trim(), pw = $("#gh-apw").value, msg = $("#gh-msg"), btn = $("#gh-go");
  const say = (cls, html) => { msg.innerHTML = `<div class="msg ${cls}">${html}</div>`; };
  if (DATA.admin && (await adminHash(pw, DATA.admin.s, DATA.admin.it)) !== DATA.admin.h) return say("bad", "<b>That admin password is not right.</b>");
  btn.disabled = true; btn.textContent = "Checking…";

    if (!j || !j.permissions || !j.permissions.push) { say("bad", "<b>This key cannot publish.</b> Make sure it has access to this repository with Contents set to Read and write."); btn.disabled = false; btn.textContent = "Connect GitHub"; return; }
    sessionStorage.setItem(GH_SESSION, key);
    localStorage.setItem(GH_SAVED, await window.__A1.seal({ k: key }, pw));
    renderCenter();
  } catch (err) { say("bad", "<b>Could not reach GitHub.</b> Check your internet connection and try again."); btn.disabled = false; btn.textContent = "Connect GitHub"; }
});

  if (!e.target.closest("#gh-off")) return;

const addMonths = (k, n) => { const [y, m] = k.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MON[m - 1]} ${y}`; };
const yesterdayIso = () => { const d = new Date(); d.setDate(d.getDate() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) xlsxPromise = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = XLSX_URL;
    s.onload = () => (window.XLSX ? res(window.XLSX) : rej(new Error("Excel reader did not load")));
    s.onerror = () => { xlsxPromise = null; rej(new Error("Could not load the Excel reader. Check the internet connection and try again.")); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}

// v2.1 (built on live 1791476952-0f5a): multi-month Field Force upload, Top 12-only months.
// Reads the workbook like the original CALCULATION FILE expects:
// a RAW DATA sheet, columns PARTICULAR / DSM / PSO / NAME / MTD AMT / first BGT 2026.
// Several months in one file: one sheet per month, named e.g. "JAN RAW DATA", "FEB RAW DATA".
// A month may carry only some PARTICULARs (e.g. only Top 12 Brand); the other tabs then show "no data".
const norm = (s) => String(s == null ? "" : s).toUpperCase().replace(/\s+/g, "");
const PARTS = { ALLPRODUCTS: "all", TOP12BRAND: "t12", TOP12: "t12", MEROPEN: "mer", TAZOPEN: "taz" };
const PART_NAMES = { all: "All Products", t12: "Top 12 Brand", mer: "Meropen", taz: "Tazopen" };
function parseRawSheet(rows, label) {
  const errors = [], warnings = [];
  const hi = rows.findIndex((r) => r && r.some((c) => norm(c) === "PARTICULAR"));
  if (hi < 0) return { errors: [`${label}: no "PARTICULAR" heading.`], warnings };
  const H = rows[hi].map(norm);
  const iPart = H.indexOf("PARTICULAR"), iD = H.indexOf("DSM"), iP = H.indexOf("PSO"), iN = H.indexOf("NAME"), iS = H.indexOf("MTDAMT");
  const iB = H.findIndex((h, i) => h.startsWith("BGT") && i > iS);
  const missing = [["DSM", iD], ["PSO", iP], ["NAME", iN], ["MTD AMT", iS], ["BGT 2026 (after MTD AMT)", iB]].filter((x) => x[1] < 0).map((x) => x[0]);
  if (missing.length) return { errors: [`${label}: missing column(s) ${missing.join(", ")}.`], warnings };
  const num = (v) => { if (v == null || v === "") return { v: 0, blank: true }; if (typeof v === "number") return { v }; const n = parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? { v: n } : { v: NaN }; };
  const psos = new Map(), otherParts = new Set(), present = new Set(); let blanks = 0;
  const bad = [];
  for (let r = hi + 1; r < rows.length; r++) {
    const row = rows[r]; if (!row || row.every((c) => c == null || c === "")) continue;
    const part = PARTS[norm(row[iPart])];
    if (!part) { if (row[iPart] != null) otherParts.add(String(row[iPart]).trim()); continue; }
    const d = String(row[iD] == null ? "" : row[iD]).trim(), p = String(row[iP] == null ? "" : row[iP]).trim();
    if (!d || !p) { bad.push(`Row ${r + 1}: missing DSM or PSO code`); continue; }
    const s = num(row[iS]), b = num(row[iB]);
    if (isNaN(s.v) || isNaN(b.v)) { bad.push(`Row ${r + 1} (${p}): sales or budget is not a number`); continue; }
    if (s.blank || b.blank) blanks++;
    let rec = psos.get(p);
    if (!rec) { rec = { d, p, n: String(row[iN] == null ? "" : row[iN]).trim() }; psos.set(p, rec); }
    else if (rec.d !== d) { bad.push(`${p} appears under two DSMs (${rec.d} and ${d})`); continue; }
    if (rec[part]) { bad.push(`${p} has more than one ${row[iPart]} row`); continue; }
    rec[part] = [Math.round(s.v * 100) / 100, Math.round(b.v * 100) / 100];
    present.add(part);
  }
  const cats = ["all", "t12", "mer", "taz"].filter((c) => present.has(c));
  const incomplete = [...psos.values()].filter((x) => cats.some((c) => !x[c])).map((x) => x.p);
  if (incomplete.length) bad.push(`${incomplete.length} PSO(s) do not have a row for every PARTICULAR in this sheet (${cats.map((c) => PART_NAMES[c]).join(", ")}): ${incomplete.slice(0, 12).join(", ")}${incomplete.length > 12 ? "…" : ""}`);
  if (present.has("mer") !== present.has("taz") || ((present.has("mer") || present.has("taz")) && !present.has("all"))) bad.push("Meropen and Tazopen rows need All Products rows too (Priority Products is worked out from all three).");
  if (!psos.size) bad.push("No PSO rows were found.");
  bad.slice(0, 15).forEach((b) => errors.push(`${label}: ${b}`)); if (bad.length > 15) errors.push(`${label}: …and ${bad.length - 15} more problems.`);
  if (otherParts.size) warnings.push(`${label}: ignored rows with other PARTICULAR values: ${[...otherParts].slice(0, 6).join(", ")}.`);
  if (blanks) warnings.push(`${label}: ${blanks} row(s) had a blank sales or budget cell, counted as 0.`);
  return { errors, warnings, psos: [...psos.values()], cats };
}
function parseWorkbook(XLSX, buf, month) {
  const wb = XLSX.read(buf, { type: "array" });
  const isRaw = (n) => norm(n).endsWith("RAWDATA");
  const monthOf = (n) => MONTH_WORDS.findIndex((w) => norm(n).startsWith(w));
  const raws = wb.SheetNames.filter(isRaw);
  if (!raws.length) {
    // Daily report workbook (v3.4): sheets ALL PRODUCTS / TOP 12 / MEROPEN / TAZOPEN, each a PSO-wise
    // RSM · DSM · PSO · NAME · MTD AMT · BGT 2026 … table with DSM / RSM subtotal rows (skipped). For the chosen month.
    const REP = { ALLPRODUCTS: "ALL PRODUCTS", TOP12: "TOP 12 BRAND", TOP12BRAND: "TOP 12 BRAND", MEROPEN: "MEROPEN", TAZOPEN: "TAZOPEN" };
    const reps = wb.SheetNames.filter((n) => REP[norm(n)]);
    if (reps.length) {
      const flat = [["PARTICULAR", "DSM", "PSO", "NAME", "MTD AMT", "BGT"]];
      for (const n of reps) {
        const g = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: null, raw: true });
        const hi = g.findIndex((r) => r && r.some((c) => norm(c) === "RSM") && r.some((c) => norm(c) === "PSO"));
        if (hi < 0) return { errors: [`Sheet "${n}": no heading row with RSM, DSM, PSO, NAME, MTD AMT, BGT.`], warnings: [], months: [] };
        const H = g[hi].map(norm), iR = H.indexOf("RSM"), iD = H.indexOf("DSM"), iP = H.indexOf("PSO"), iN = H.indexOf("NAME"), iS = H.indexOf("MTDAMT"), iB = H.findIndex((h, i) => h.startsWith("BGT") && i > iS);
        if ([iD, iP, iN, iS, iB].some((i) => i < 0)) return { errors: [`Sheet "${n}": missing DSM, PSO, NAME, MTD AMT or BGT column.`], warnings: [], months: [] };
        g.slice(hi + 1).forEach((r) => { if (!r) return; const t = (i) => String(r[i] == null ? "" : r[i]).trim();
          if (!t(iR) || !t(iD) || !t(iP)) return;   // PSO rows carry RSM + DSM + PSO; subtotal rows don't
          flat.push([REP[norm(n)], t(iD), t(iP), t(iN), r[iS], r[iB]]); });
      }
      const r = parseRawSheet(flat, `Sheets ${reps.map((n) => `"${n}"`).join(", ")}`);
      const months = r.errors.length ? [] : [{ key: month, sheet: reps.join(" + "), psos: r.psos, cats: r.cats }];
      return { errors: r.errors, warnings: r.warnings, months, dsmNames: {}, hasNames: false };
    }
    return { errors: [`No "RAW DATA" sheet, and no ALL PRODUCTS / TOP 12 / MEROPEN / TAZOPEN report sheets. Sheets in this file: ${wb.SheetNames.join(", ")}.`], warnings: [], months: [] };
  }
  const named = raws.filter((n) => monthOf(n) >= 0);
  const selY = +month.slice(0, 4), selM = +month.slice(5, 7);
  let list;
  if (named.length > 1 || (named.length === 1 && raws.length === 1 && norm(named[0]) !== "RAWDATA")) {
    // one sheet per month; months after the chosen month belong to the previous year
    list = named.map((n) => { const mi = monthOf(n) + 1; return { name: n, key: `${mi > selM ? selY - 1 : selY}-${String(mi).padStart(2, "0")}` }; });
  } else list = [{ name: raws.find((n) => norm(n) === "RAWDATA") || raws[0], key: month }];
  const errors = [], warnings = [], months = [];
  for (const sh of list) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sh.name], { header: 1, defval: null, raw: true });
    const r = parseRawSheet(rows, `Sheet "${sh.name}"`);
    errors.push(...r.errors); warnings.push(...r.warnings);
    if (months.some((x) => x.key === sh.key)) errors.push(`Two sheets are for ${monthLabel(sh.key)}.`);
    if (!r.errors.length) months.push({ key: sh.key, sheet: sh.name, psos: r.psos, cats: r.cats });
  }
  if (list.length === 1 && months.length === 1 && months[0].key !== month) errors.push(`Sheet "${list[0].name}" is for ${monthLabel(months[0].key)}, but Month is set to ${monthLabel(month)}.`);
  // Optional DSM names from FIELD FORCE NAME
  const dsmNames = {};
  const ffName = wb.SheetNames.find((n) => norm(n) === "FIELDFORCENAME");
  if (ffName) {
    const fr = XLSX.utils.sheet_to_json(wb.Sheets[ffName], { header: 1, defval: null });
    const fh = fr.findIndex((r) => r && r.some((c) => norm(c) === "CODE"));
    if (fh >= 0) {
      const FH = fr[fh].map(norm), iC = FH.indexOf("CODE"), iNm = FH.indexOf("NAME"), iDs = FH.indexOf("DESIGNATION");
      fr.slice(fh + 1).forEach((r) => { if (r && norm(r[iDs]) === "DSM" && r[iC] != null) dsmNames[String(r[iC]).trim()] = String(r[iNm] == null ? "" : r[iNm]).trim(); });
    }
  }
  months.sort((a, b) => (a.key < b.key ? -1 : 1));
  return { errors, warnings, months, dsmNames, hasNames: !!ffName };
}

// Field Force Sales Status: one RAW DATA sheet for the chosen month, or one sheet per month.
function ffCheck(X, buf, ctx) {
  const { month, type, date } = ctx;
  const res = parseWorkbook(X, buf, month);
  if (res.errors.length) return res;
  const multi = res.months.length > 1;
  res.months.forEach((m) => { m.running = type === "running" && m.key === month; });
  const anyRun = res.months.some((m) => m.running);
  if (anyRun && month < LATEST) res.errors.push(`${monthLabel(month)} is a past month. Choose "Month end" for past months.`);
  if (anyRun && !date) res.errors.push('Enter the "Data up to" date.');
  if (res.errors.length) return res;
  const newest = res.months[res.months.length - 1];
  const prev = dataFor(newest.key) || dataFor(LATEST);
  if (prev) {
    const before = new Set(prev.psos.map((x) => x.p)), after = new Set(newest.psos.map((x) => x.p));
    const added = [...after].filter((x) => !before.has(x)), gone = [...before].filter((x) => !after.has(x));
    if (added.length) res.warnings.push(`New PSO code(s) compared with the portal: ${added.slice(0, 10).join(", ")}${added.length > 10 ? "…" : ""}`);
    if (gone.length) res.warnings.push(`PSO code(s) in the portal but not in this file: ${gone.slice(0, 10).join(", ")}${gone.length > 10 ? "…" : ""}`);
  }
  const vac = newest.psos.filter((x) => isVacant(x.n)).length;
  if (vac) res.warnings.push(`${vac} vacant territor${vac === 1 ? "y" : "ies"} (kept in the rankings).`);
  const names = { ...DATA.dsms, ...res.dsmNames };
  const noName = [...new Set(res.months.flatMap((m) => m.psos.map((x) => x.d)))].filter((d) => !names[d]);
  if (noName.length) res.warnings.push(`No name found for DSM code(s): ${noName.join(", ")}. Include the FIELD FORCE NAME sheet to add names.`);
  const partial = res.months.filter((m) => m.cats.length < 4);
  if (partial.length) res.warnings.push(`${partial.map((m) => monthLabel(m.key)).join(", ")}: only ${[...new Set(partial.flatMap((m) => m.cats))].map((c) => PART_NAMES[c]).join(", ")} in the file. The other tabs will show "no data" for ${partial.length === 1 ? "that month" : "those months"}.`);
  const replaced = res.months.filter((m) => dataFor(m.key));
  if (replaced.length) res.warnings.push(`This replaces the ${replaced.map((m) => monthLabel(m.key)).join(", ")} data currently in the portal.`);
  const upTo = anyRun ? fmtDate(date) : null;
  const catOK = (m, c) => (c.need || [c.id]).every((x) => m.cats.includes(x));
  const rowsFor = (m) => CATS.map((c) => { if (!catOK(m, c)) return [c.title, null, null, null]; const r = rankNational(m.psos, c); const S = r.reduce((a, x) => a + x.s, 0), B = r.reduce((a, x) => a + x.b, 0); return [c.title, S, B, S / B * 100]; });
  const dsmCount = new Set(newest.psos.map((x) => x.d)).size;
  const span = multi ? `${monthLabel(res.months[0].key)} – ${monthLabel(newest.key)} (${res.months.length} months)` : monthLabel(newest.key);
  res.html = `<div class="msg ok"><b>Ready: ${newest.psos.length} PSOs under ${dsmCount} DSMs · ${span} · ${upTo ? "data up to " + upTo : "month end"}</b>
      <p class="muted">Compare these Accela totals with your Excel before publishing.</p>
      ${res.months.map((m) => `${multi ? `<p class="muted"><b>${monthLabel(m.key)}</b> · sheet "${esc(m.sheet)}" · ${m.psos.length} PSOs</p>` : ""}${totTable("Category", rowsFor(m))}`).join("")}</div>`;
  res.apply = (next) => {
    next.dsms = { ...next.dsms, ...res.dsmNames };
    res.months.forEach((m) => { const o = { upTo: m.running ? upTo : null, final: !m.running, psos: m.psos }; if (m.cats.length < 4) o.cats = m.cats; next.months[m.key] = dsiCarry(next.months[m.key], o, dsiSnapFF); });
  };
  res.hist = { m: res.months[0].key, m2: multi ? newest.key : null, final: !anyRun, upTo, n: newest.psos.length };
  res.flash = `${span} published for Field Force Sales Status.`;
  return res;
}

const totTable = (label, rows) => `<div class="tablebox"><table><thead><tr><th>${label}</th><th class="num">Sales (Tk)</th><th class="num">Budget (Tk)</th><th class="num">Ach</th></tr></thead>
  <tbody>${rows.map(([t, S, B, A]) => S == null ? `<tr><td>${esc(t)}</td><td colspan="3" class="muted">not in this file</td></tr>` : `<tr><td>${esc(t)}</td><td class="num">${tk(S)}</td><td class="num">${tk(B)}</td><td class="num"><span class="pill ${tone(A)}">${pct(A)}</span></td></tr>`).join("")}</tbody></table></div>`;

// Power Brand Tracker: one or more brand sheets (e.g. "SEPT TOP 12", "AUG TOP 12").
// The month comes from the sheet name; a single sheet without a month in its name uses the chosen month.
const MONTH_WORDS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function pbCheck(X, buf, ctx) {
  const { month, type, date } = ctx;
  const errors = [], warnings = [];
  const wb = X.read(buf, { type: "array" });
  const sheets = [];
  for (const name of wb.SheetNames) {
    const rows = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });
    const hi = rows.findIndex((r) => r && r.some((c) => norm(c) === "BRAND") && r.some((c) => norm(c) === "PSO"));
    if (hi >= 0) sheets.push({ name, rows, hi });
  }
  if (!sheets.length) {
    // Daily report workbook (v3.5): one sheet per brand (sheet name = brand), each a PSO-wise
    // RSM · DSM · PSO · NAME · MTD AMT · BGT 2026 … table with DSM / RSM subtotal rows (skipped). For the chosen month.
    const flat = [["BRAND", "DSM", "PSO", "NAME", "MTD AMT", "BGT"]];
    const known = PB_LATEST ? pbBrands(PB_LATEST) : [], at = (n) => { const i = known.indexOf(String(n).trim().toUpperCase()); return i < 0 ? 999 : i; };
    for (const name of [...wb.SheetNames].sort((a, b) => at(a) - at(b))) {   // keep the portal's usual brand order
      const g = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });
      const hi = g.findIndex((r) => r && r.some((c) => norm(c) === "RSM") && r.some((c) => norm(c) === "PSO"));
      if (hi < 0) continue;
      const H = g[hi].map(norm), iR = H.indexOf("RSM"), iD = H.indexOf("DSM"), iP = H.indexOf("PSO"), iN = H.indexOf("NAME"), iS = H.indexOf("MTDAMT"), iB = H.findIndex((h, i) => h.startsWith("BGT") && i > iS);
      if ([iD, iP, iN, iS, iB].some((i) => i < 0)) { errors.push(`Sheet "${name}": missing DSM, PSO, NAME, MTD AMT or BGT column.`); continue; }
      const br = String(name).trim().toUpperCase();
      g.slice(hi + 1).forEach((r) => { if (!r) return; const t = (i) => String(r[i] == null ? "" : r[i]).trim();
        if (!t(iR) || !t(iD) || !t(iP)) return;   // PSO rows carry RSM + DSM + PSO; subtotal rows don't
        flat.push([br, t(iD), t(iP), t(iN), r[iS], r[iB]]); });
    }
    if (errors.length) return { errors, warnings };
    if (flat.length > 1) sheets.push({ name: "Brand sheets", rows: flat, hi: 0 });
  }
  if (!sheets.length) return { errors: [`No brand sheet found. Use the daily file with one sheet per brand (RSM, DSM, PSO, NAME, MTD AMT, BGT 2026 columns), or a sheet with BRAND, DSM, PSO, NAME, MTD AMT and BGT 2026 columns. Sheets in this file: ${wb.SheetNames.join(", ")}.`], warnings };
  const selY = +month.slice(0, 4), selM = +month.slice(5, 7);
  const parsed = [];
  for (const sh of sheets) {
    const nm = norm(sh.name), mi = MONTH_WORDS.findIndex((w) => nm.startsWith(w));
    let key;
    if (mi < 0) {
      if (sheets.length > 1) { errors.push(`Can't tell which month sheet "${sh.name}" is. Start the sheet name with the month, e.g. "SEPT TOP 12".`); continue; }
      key = month;
    } else {
      if (sheets.length === 1) {
        if (mi + 1 !== selM) { errors.push(`Sheet "${sh.name}" is named for ${MON[mi]}, but Month is set to ${monthLabel(month)}. Change the Month or rename the sheet.`); continue; }
        key = month;
      } else {
        const y = mi + 1 > selM ? selY - 1 : selY;   // months after the chosen month belong to the previous year
        key = `${y}-${String(mi + 1).padStart(2, "0")}`;
      }
    }
    const H = sh.rows[sh.hi].map(norm);

// ---------- Quality Quest: monthly QIC+QIS data ----------
// Reads only the input columns (A–L) of each month sheet; the portal scores, codes and ranks every PSO itself.
function qicCheck(X, buf, ctx) {
  const errors = [], warnings = [], notes = [];
  const wb = X.read(buf, { type: "array" });
  const selY = +ctx.month.slice(0, 4), selM = +ctx.month.slice(5, 7);
  const found = [];
  // When month-named sheets exist (JUN, JUL …), only those are read; other sheets (Ranking Report, Dashboard …) are ignored.
  const monthNamed = wb.SheetNames.filter((n) => MONTH_WORDS.some((w) => norm(n).startsWith(w)) && norm(n).length <= 9);
  for (const name of (monthNamed.length ? monthNamed : wb.SheetNames)) {
    const rows = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });
    const hi = rows.findIndex((r) => r && r.some((c) => norm(c) === "PSO") && r.some((c) => norm(c) === "DSM") && r.some((c) => norm(c).startsWith("CHEM")));
    if (hi < 0) continue;
    const body = rows.slice(hi + 1).filter((r) => r && r[2] != null && String(r[2]).trim() !== "");
    if (!body.length) { notes.push(name); continue; }
    found.push({ name, rows, hi });
  }
  if (!found.length) return { errors: [`No QIC month sheet with data found. A sheet needs the DSM, Name, PSO … Chemist Cov headings (columns A–L).${notes.length ? " Empty sheets: " + notes.join(", ") + "." : ""}`], warnings };
  const parsed = [];
  for (const sh of found) {
    const nm = norm(sh.name), mi = MONTH_WORDS.findIndex((w) => nm.startsWith(w));
    let key;
    if (mi < 0) { if (found.length > 1) { errors.push(`Can't tell which month sheet "${sh.name}" is. Name it like "SEP".`); continue; } key = ctx.month; }
    else if (found.length === 1) { if (mi + 1 !== selM) { errors.push(`Sheet "${sh.name}" is named for ${MON[mi]}, but Month is set to ${monthLabel(ctx.month)}. Change the Month or rename the sheet.`); continue; } key = ctx.month; }
    else { const y = mi + 1 > selM ? selY - 1 : selY; key = `${y}-${String(mi + 1).padStart(2, "0")}`; }
    const H = sh.rows[sh.hi].map(norm);
    const find = (test, pos) => { const i = H.findIndex(test); return i >= 0 ? i : pos; };
    const ix = { d: find((h) => h === "DSM", 0), n: find((h) => h === "NAME", 1), p: find((h) => h === "PSO", 2), base: find((h) => h === "BASE", 3), s: find((h) => h === "SALES", 4), b: find((h) => h === "BUDGET", 5),
      a: find((h) => h.startsWith("ACH"), 6), t: find((h) => h.startsWith("#T12"), 7), tn: find((h) => h.startsWith("T12BRAND"), 8), rx: find((h) => h.startsWith("RX"), 9), dr: find((h) => h.startsWith("DR"), 10), ch: find((h) => h.startsWith("CHEM"), 11),
      total: H.findIndex((h) => h === "TOTALSCORE") };
    const val = (v) => { if (v == null || v === "") return null; if (typeof v === "number") return v; const t = String(v).trim(); const n = parseFloat(t.replace(/,/g, "")); return isFinite(n) && /^[-\d.,]+$/.test(t) ? n : t; };
    const rows = [], seen = new Set(), dup = [], fileTotals = new Map(); let na = 0, badNum = 0;
    for (let r = sh.hi + 1; r < sh.rows.length; r++) {
      const row = sh.rows[r]; if (!row) continue;
      const p = row[ix.p] == null ? "" : String(row[ix.p]).trim(); if (!p) continue;
      if (seen.has(p)) { dup.push(p); continue; } seen.add(p);
      const rec = [String(row[ix.d] ?? "").trim(), String(row[ix.n] ?? "").trim(), p, String(row[ix.base] ?? "").trim(),
        val(row[ix.s]), val(row[ix.b]), val(row[ix.a]), val(row[ix.t]), row[ix.tn] != null && String(row[ix.tn]).trim() !== "" ? String(row[ix.tn]).trim() : null, val(row[ix.rx]), val(row[ix.dr]), val(row[ix.ch])];
      [9, 10, 11].forEach((i) => { if (typeof rec[i] !== "number") { if (rec[i] != null && !/^(#?N\/?A|-+|–)$/i.test(String(rec[i]).trim())) badNum++; rec[i] = null; na++; } });
      [4, 5, 6, 7].forEach((i) => { if (typeof rec[i] !== "number") { if (rec[i] != null) badNum++; rec[i] = typeof rec[i] === "number" ? rec[i] : null; } });

    if (parsed.some((x) => x.key === key)) errors.push(`Two sheets are for ${monthLabel(key)}.`);
    if (na) warnings.push(`${monthLabel(key)}: ${na} Rx / Dr. coverage / Chemist coverage cell(s) are blank or N/A (scored as 0).`);

      if (diff.length) warnings.push(`${monthLabel(x.key)}: the portal's total score differs from the file's TOTAL SCORE for ${diff.length} PSO(s), e.g. ${diff.slice(0, 5).map((r) => `${r.p} (file ${fScore(x.fileTotals.get(r.p))}, portal ${fScore(r.total)})`).join(", ")}. The portal uses the criteria in effect from ${monthLabel(critFor(x.key).from)}.`);
      else notes.push(`${monthLabel(x.key)}: all ${x.fileTotals.size} totals match the file`);
    }
